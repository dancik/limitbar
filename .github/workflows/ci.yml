name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned binary, checksum verified)
        run: |
          curl -fsSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - name: no personal paths, emails or tokens in any commit
        run: scripts/leakcheck.sh

  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n install.sh
      - run: scripts/build-app.sh build --universal
      - run: tests/states.sh build/LimitBar.app
      - run: tests/sandbox.sh
      - run: tests/usage.sh build/LimitBar.app
      - name: fresh machine — no AI CLI installed, all four must read "missing"
        run: |
          build/LimitBar.app/Contents/MacOS/LimitBar --probe | tee probe.json
          /usr/bin/python3 -c 'import json; d=json.load(open("probe.json")); bad={k:v["state"] for k,v in d.items() if v["state"]!="missing"}; assert not bad, bad'
